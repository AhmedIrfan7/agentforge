[project]
name = "agentforge-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.19.0",
    "anyio>=4.14.2",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "cryptography>=50.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.3",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pgvector>=0.4.2",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "py3langid>=0.3.0",
    "pyotp>=2.10.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.1",
    "tiktoken>=0.13.0",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "reportlab>=5.0.0",
    "ruff>=0.16.1",
    "types-openpyxl>=3.1.5.20260807",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# B008: FastAPI's Depends()/Query()/etc. are meant to be called in argument
# defaults — that's the framework's actual DI pattern, not a footgun here.
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# aioboto3/botocore ship no type stubs or py.typed marker (storage.py,
# roadmap step 084) — unlike every other third-party dependency in this
# project, which is fully typed.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

# Same gap as aioboto3/botocore above, for filetype (validation.py,
# roadmap step 085).
[[tool.mypy.overrides]]
module = ["filetype.*"]
ignore_missing_imports = true

# Same gap as aioboto3/botocore above, for celery (celery_app.py,
# roadmap step 089).
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# reportlab is dev-only (test fixtures for extraction_pdf.py, roadmap
# step 091 — generates real PDFs to test against, never imported by
# application code) and ships no type stubs.
[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

# Same gap as aioboto3/botocore above, for py3langid (extraction_metadata.py,
# roadmap step 094).
[[tool.mypy.overrides]]
module = ["py3langid.*"]
ignore_missing_imports = true
