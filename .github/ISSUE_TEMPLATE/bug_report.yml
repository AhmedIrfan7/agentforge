name: Bug report
description: Something in AgentForge doesn't work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. This project is pre-beta and self-hosted
        only (no live public instance yet) — see [`docs/self-hosted-deployment.md`](../../docs/self-hosted-deployment.md)
        for how most people are running it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the actual behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact steps — commands run, endpoints called, pages visited.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part of the codebase?
      options:
        - apps/api (backend)
        - apps/web (admin dashboard)
        - apps/widget (embeddable widget)
        - Infrastructure (docker-compose, CI, deploy workflows)
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit SHA or version
      description: Which commit/tag you're running (`git rev-parse HEAD`). This project has no tagged release yet, so a commit SHA is the real answer for now.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Real logs help far more than a description alone. Redact secrets before pasting.
      render: shell
