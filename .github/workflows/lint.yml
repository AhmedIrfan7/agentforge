name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-lint:
    name: Lint apps/api (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --all-groups
      - name: Ruff check
        working-directory: apps/api
        run: uv run ruff check .
      - name: Ruff format check
        working-directory: apps/api
        run: uv run ruff format --check .
      - name: Mypy
        working-directory: apps/api
        run: uv run mypy .

  web-lint:
    name: Lint apps/web (eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm --filter @agentforge/web run lint
      - name: Prettier check
        run: pnpm --filter @agentforge/web run format:check
      - name: Typecheck shared package
        run: pnpm --filter @agentforge/shared run typecheck
